name: Models smoke

# Fork: one-shot check that this repository can reach GitHub Models, which the
# upstream-sync classifier would call instead of carrying its own API key.
# It tries the model both through the official action and over REST, because
# the action's response parsing is what failed first.
on:
  push:
    branches: [feat-studio/upstream-sync]
    paths:
      - .github/workflows/models-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call the model over REST
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          body=$(jq -n '{model:"openai/gpt-4o-mini",messages:[{role:"user",content:"Answer with exactly one word: OK"}],max_tokens:16}')
          code=$(curl -sS -o rest.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" \
            https://models.github.ai/inference/chat/completions)
          echo "http=$code"
          head -c 800 rest.json
          echo
          {
            echo "## GitHub Models smoke (REST)"
            echo
            echo "- http: $code"
            echo "- body: \`$(head -c 300 rest.json | tr -d '\n')\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/ai-inference@v1
        id: ai
        continue-on-error: true
        with:
          model: openai/gpt-4o-mini
          prompt: "Answer with exactly one word: OK"
      - name: Report what the action returned
        env:
          RESPONSE: ${{ steps.ai.outputs.response }}
          OUTCOME: ${{ steps.ai.outcome }}
        run: |
          echo "action outcome=$OUTCOME response=${RESPONSE:-<empty>}"