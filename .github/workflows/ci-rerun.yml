name: CI rerun

# A run cannot rerun itself ("This workflow is already running"), so the retry
# lives in its own workflow triggered by CI's completion. It reruns the failed
# jobs exactly once, and only when every failed job's log carries a known flake
# signature (runtime-level faults, package timeouts, cleanup races). A
# deterministic failure — lint, contract, compile error, assertion — is left red:
# rerunning it burns a runner without changing the outcome, and hides a real
# regression behind a higher attempt number.
# run_attempt 2 and later never re-enter, so it cannot loop, and --failed keeps
# the retry scoped to what actually broke.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  rerun:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # workflow_dispatch has no triggering run: fall back to the latest
          # failed CI run on this branch.
          if [ -z "$TARGET" ]; then
            TARGET="$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml --branch "${GITHUB_REF_NAME}" \
              --status failure --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "No failed run to retry"; exit 0
          fi

          # Signatures of the environment-level flakes these hosted runners
          # produce; keep in sync with the in-step retry list in ci.yml.
          # "the turn never closed" is a test-internal budget timeout (half of
          # the binary deadline), the same class as ": timed out"; "go: unlinkat
          # ...: Access is denied" is the runner's antivirus holding the freshly
          # built test binary. Both pass on a rerun.
          flake_re='found pointer to free object|fatal error: fault|fatal error: unknown caller pc|runtime: netpoll failed|runtime\.semasleep|runtime\.semawakeup|waitforsingleobject wait_failed|setevent failed|TempDir RemoveAll cleanup|: timed out|timed out waiting for|timed out after [0-9]+|the turn never closed|go: unlinkat'

          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TARGET/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion=="failure") | "\(.id)\t\(.name)"')"
          if [ -z "$jobs" ]; then
            echo "Run $TARGET has no failed job to classify"; exit 0
          fi

          # Any failing job without a flake signature means the run is a genuine
          # regression: leave it red instead of retrying.
          # Job logs carry terminal escape sequences, which gh refuses to print
          # ("pass --allow-escape-sequences") and exits 1 on — leaving $log
          # empty and every job "without a known flake signature". curl hands
          # back the same text with the escapes intact, and the patterns above
          # match on plain substrings, so the escapes do not matter.
          while IFS="$(printf '\t')" read -r id name; do
            [ -n "$id" ] || continue
            log="$(curl -sSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" || true)"
            # The size line makes an empty fetch visible: gh's refusal to print
            # escape sequences left this at 0 on every job, which is how the
            # retry silently judged every failure "deterministic".
            echo "$name: job log size=${#log}"
            if ! printf '%s' "$log" | grep -Eq "$flake_re"; then
              echo "::warning::$name failed without a known flake signature; leaving the run red"
              {
                echo "### 未重跑（确定性失败）"
                echo ""
                echo "失败的 job \`$name\` 的日志里没有已知 flake 特征 —— 这是真的错误，不是环境抖动。"
                echo "请按「push 前预检」在本地复现并修复，不要靠重跑掩盖。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$name: known flake signature found"
          done <<< "$jobs"

          echo "All failed jobs match known flakes; retrying run $TARGET"
          {
            echo "### 已重跑（环境性 flake）"
            echo ""
            echo "失败的 job 全部命中已知 flake 特征，只重跑失败的 job。"
          } >> "$GITHUB_STEP_SUMMARY"
          gh run rerun "$TARGET" --failed --repo "$GITHUB_REPOSITORY"