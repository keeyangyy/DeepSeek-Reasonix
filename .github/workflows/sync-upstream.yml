name: Sync upstream (shadow)

# Fork: upstream sync, shadow stage. Every six hours it asks one question — has
# upstream cut a new studio-v* release? — and when it has, it merges that
# release into a throwaway checkout, intersects the result with the fork's own
# customizations (tools/forkguard), and reports what needs review.
#
# It never pushes studio-mine, never releases and never touches the
# studio-latest anchor; those arrive with the later stages. The criteria it
# follows are recorded in the project docs (decisions/2026-10-16-上游自动同步与发版.md),
# which are not part of this repository.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream tag to sync (empty: the newest studio-v*)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      base: ${{ steps.pick.outputs.base }}
      proceed: ${{ steps.pick.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: pick
        name: Pick the release to sync
        env:
          WANTED: ${{ inputs.tag }}
          BASE: ${{ vars.SYNC_BASE }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/esengine/DeepSeek-Reasonix.git
          git fetch --quiet --tags upstream
          tag="${WANTED:-$(git tag --list 'studio-v*' --sort=-v:refname | head -1)}"
          proceed=false
          if [ -n "$tag" ] && [ -n "$BASE" ] && [ "$tag" != "$BASE" ]; then
            proceed=true
          fi
          {
            echo "tag=$tag"
            echo "base=$BASE"
            echo "proceed=$proceed"
          } >> "$GITHUB_OUTPUT"
          echo "newest=$tag base=$BASE proceed=$proceed" >> "$GITHUB_STEP_SUMMARY"

  review:
    needs: probe
    if: needs.probe.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.probe.outputs.tag }}
      BASE: ${{ needs.probe.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Merge the release into a throwaway branch
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/esengine/DeepSeek-Reasonix.git
          git fetch --quiet --tags upstream
          git config user.name "reasonix-sync"
          git config user.email "reasonix-sync@users.noreply.github.com"
          git switch --create "sync/upstream-$TAG" studio-mine
          : > conflicted.txt
          if git merge --no-edit "$TAG"; then
            echo "clean" > merge-state.txt
          else
            echo "conflicted" > merge-state.txt
            git diff --name-only --diff-filter=U | sort > conflicted.txt
          fi
          echo "merge state: $(cat merge-state.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Intersect with the fork's customizations
        run: |
          set -euo pipefail
          go run ./tools/forkguard -range "$BASE..$TAG" > report.json
          jq -e '.changes >= 0' report.json > /dev/null
      - name: Write the report
        run: |
          set -euo pipefail
          {
            echo "## 上游同步 $TAG（base $BASE）"
            echo
            echo "- 改动文件：$(jq -r .changes report.json)"
            echo "- 命中定制点：$(jq -r '.hits | length' report.json)"
            echo "- 上游新增文件：$(jq -r '.upstream_added | length' report.json)"
            echo "- 合并状态：$(cat merge-state.txt)"
            echo
            if [ -s conflicted.txt ]; then
              echo "### 文本冲突"
              echo '```'
              cat conflicted.txt
              echo '```'
              echo
            fi
            echo "### 命中（需判读）"
            jq -r '.hits[] | "- `\(.path)` — \(.topic)（\(.kind), \(.status)）"' report.json
            echo
            echo "### 守护测试（先跑这些：全绿则不必判读）"
            jq -r '.guards[] | "- `\(.)`"' report.json
            echo
            echo "### 上游新增文件（前 40，反向吸收看这里）"
            jq -r '.upstream_added[:40][] | "- `\(.)`"' report.json
            echo
            echo "> 影子模式：本流程不推 studio-mine、不出包、不动锚点。判读口径见 \`tools/forkguard/classify.md\`。"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open the review issue once per release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[上游同步] $TAG"
          existing=$(gh issue list --state all --search "$title in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "issue for $TAG already exists; leaving it alone" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue create --title "$title" --body-file report.md