name: Release (manual)

# One-shot fork release pipeline: dispatch it with the version to publish, it
# waits for the official CI of the current main-v2-mine commit to turn green and
# only then creates the annotated tag plus a DRAFT GitHub Release. A tag is
# therefore never created for a commit whose CI is red, and the Release stays
# invisible until release-windows.yml attaches the portable archive and the
# installer a few minutes later.
#
#   gh workflow run "Release (manual)" -R keeyangyy/DeepSeek-Reasonix \
#     -r main-v2-mine -f version=1.39.5-mine.1 -f notes="$(cat notes.md)"
#
# The version input never carries the leading v (v1.39.5-mine.1 would produce
# tag vv1.39.5-mine.1). Windows-only: the upstream macOS/Linux/CLI/npm lines
# need signing and CDN secrets this fork does not have.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the leading v, e.g. 1.39.5-mine.1"
        required: true
        type: string
      title:
        description: "Release title (optional; defaults to v<version>)"
        required: false
        type: string
      notes:
        description: "Release notes (optional; defaults to an auto-summary)"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  # Dispatches release-windows.yml at the end of the release; GITHUB_TOKEN
  # needs actions: write for workflow_dispatch of another workflow.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main-v2-mine
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for official CI of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          DEADLINE=$((SECONDS + 5400))
          RETRIED=0
          while true; do
            LATEST=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA" \
              --jq '.workflow_runs[] | select(.name=="CI") | "\(.status) \(.conclusion) \(.id)"' | head -1 || true)
            if [ -n "$LATEST" ]; then
              STATUS=$(echo "$LATEST" | awk '{print $1}')
              CONCLUSION=$(echo "$LATEST" | awk '{print $2}')
              RUN_ID=$(echo "$LATEST" | awk '{print $3}')
              echo "CI run $RUN_ID: $STATUS/$CONCLUSION"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "CI passed; proceeding to tag."
                  exit 0
                fi
                # One automatic retry of the failed jobs: CI is occasionally red
                # from runner flakes (Windows runtime / race timing) rather than
                # from repo code.
                if [ "$RETRIED" = "0" ]; then
                  echo "CI failed (run $RUN_ID); retrying failed jobs once."
                  gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
                  RETRIED=1
                  sleep 30
                  continue
                fi
                echo "::error::CI failed again after retry (run $RUN_ID); release aborted, no tag created."
                exit 1
              fi
            else
              echo "CI run for $SHA not created yet"
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timed out after 90 minutes waiting for CI on $SHA."
              exit 1
            fi
            sleep 60
          done

      - name: Create annotated tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists; aborting."
            exit 1
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          TITLE: ${{ github.event.inputs.title }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="${TITLE:-v$VERSION}"
          # Create the release as a draft: the Windows pipeline attaches the
          # installer and portable archive a few minutes later, and a public
          # release must never be visible without its assets.
          # release-windows.yml publishes it once both assets are uploaded.
          if [ -n "$NOTES" ]; then
            gh release create "v$VERSION" --draft --target main-v2-mine --title "$RELEASE_TITLE" --notes "$NOTES"
          else
            # Auto-summary over the fork's own release line only: the branch is
            # hundreds of upstream commits ahead of the first -mine tag, so
            # ranging over the upstream tags would dump all of them.
            PREV="$(git tag --merged HEAD -l 'v[0-9]*-mine.[0-9]*' --sort=-creatordate | grep -vx "v$VERSION" | sed -n '1p' || true)"
            if [ -z "$PREV" ]; then
              RANGE=""
              RANGE_NOTE="first -mine release on this branch"
            else
              RANGE="$PREV..HEAD"
              RANGE_NOTE="$PREV → v$VERSION"
            fi
            {
              echo "## 变更总览（$RANGE_NOTE）"
              echo
              git log "$RANGE" --no-merges --pretty=format:'- %s' 2>/dev/null || true
              echo
            } > /tmp/release-notes.md
            gh release create "v$VERSION" --draft --target main-v2-mine --title "$RELEASE_TITLE" --notes-file /tmp/release-notes.md
          fi

      - name: Dispatch Windows artifact pipeline
        # GITHUB_TOKEN pushes do not trigger tag workflows, but workflow_dispatch
        # is an allowed exception — relay the just-created tag to
        # release-windows.yml, which builds the portable archive + NSIS
        # installer and uploads both to this release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release-windows.yml --repo "$GITHUB_REPOSITORY" --ref main-v2-mine -f "tag=v$VERSION"