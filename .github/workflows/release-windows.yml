name: Release Windows

# Tag-driven Windows release for the v1.38.* line.
#
# Scope: this fork ships Windows x64 only. The upstream pipeline
# (release-stable.yml -> release-desktop.yml) publishes CLI + npm + a four
# platform desktop matrix behind an approval gate and 11 SignPath/Apple/R2
# secrets; none of that applies here, and release-stable-trigger.yml is guarded
# off in this repository so upstream tags cannot dispatch it.
#
# Tag convention: v1.38.NN, or the pre-release form v1.38.NN-beta.M, where 1.38
# is the upstream baseline the fork tracks and NN is the fork's own increment.
# Three numeric segments are required: the NSIS installer builds
# VIProductVersion from `${version}.0` (see
# desktop/build/windows/installer/project.nsi), so a four-segment tag such as
# v1.38.2.1 would produce an invalid five-segment version and fail the build.
# The -beta.M suffix is stripped before it reaches NSIS (scripts/desktop-build.sh
# does numver="${numver%%-*}"), so v1.38.54-beta.1 builds as the valid 1.38.54.
#
#   git tag v1.38.21 && git push origin v1.38.21
#   git tag v1.38.54-beta.1 && git push origin v1.38.54-beta.1
#
# Produces a GitHub Release with the portable archive and the NSIS installer.

on:
  push:
    tags:
      # Glob, not regex: GitHub tag filters do not support '+'. Keep this wide
      # and enforce the exact three-segment shape in the verify step below.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.38.21)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag shape and the branch it sits on
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N, got: $RELEASE_TAG" >&2
            echo "::error::four-segment tags (e.g. v1.38.2.1) break the NSIS installer build" >&2
            exit 1
          fi
          # Only a tag on this fork's own line may publish. The v[0-9]* glob
          # above also matches the other lines' tags, and a tag on a commit no
          # CI run here ever gated must never ship artifacts.
          if ! git merge-base --is-ancestor HEAD origin/wails-mine; then
            echo "::error::$RELEASE_TAG is not on origin/wails-mine" >&2
            exit 1
          fi
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

  build:
    needs: verify
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # download-artifact reads the run's artifacts through the Actions API;
      # an explicit permissions block turns every unlisted scope off.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: reasonix-windows-amd64-${{ needs.verify.outputs.version }}
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Asset names carry no version: the release tag and latest.json
          # already identify the version, and the updater requires the
          # versionless installer name. The portable archive is renamed so a
          # download is self-describing instead of looking like a bare zip.
          zip_asset="Reasonix-windows-amd64-portable.zip"
          exe_asset="Reasonix-windows-amd64-installer.exe"
          mv dist/Reasonix-windows-amd64.zip "dist/${zip_asset}"
          # release-manual.yml creates this release as a draft before the
          # Windows build starts, so it is never public without its assets.
          # Create it here too when this workflow is dispatched on its own.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG absent; creating it as a draft."
            gh release create "$RELEASE_TAG" --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            echo "Release $RELEASE_TAG already exists; uploading/overwriting assets."
          fi
          gh release upload "$RELEASE_TAG" "dist/${zip_asset}" "dist/${exe_asset}" --clobber
          # Publish only now that both assets are attached.
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Publish the signed update manifest to the release anchor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # The installer keeps its versionless name from the upload step, so
          # the updater's required filename and the manifest input are the same
          # file — no second copy is made.
          # The manifest input directory must hold only the updater artifact:
          # the portable .zip would add a downloads group to the manifest, and
          # this line publishes no such group.
          rm -rf manifest-input
          mkdir -p manifest-input
          cp dist/Reasonix-windows-amd64-installer.exe manifest-input/
          ( cd desktop && go run ./cmd/sign sign ../dist/Reasonix-windows-amd64-installer.exe )
          ( cd desktop && go run ./cmd/sign manifest ../manifest-input "$RELEASE_TAG" "$RELEASE_TAG" )
          gh release upload "$RELEASE_TAG" \
            dist/Reasonix-windows-amd64-installer.exe \
            dist/Reasonix-windows-amd64-installer.exe.minisig \
            --clobber
          # The version catalog points each entry at <tag>/latest.json, so the
          # same manifest has to exist on the version's own release too — the
          # anchor below is overwritten by every release and cannot serve as an
          # immutable per-version address.
          gh release upload "$RELEASE_TAG" manifest-input/latest.json --clobber
          # The anchor is a fixed tag whose contents every release of this line
          # overwrites, so the updater never follows the repository-wide latest
          # badge -- which the studio and legacy 1.39 lines also claim.
          if ! gh release view wails-latest >/dev/null 2>&1; then
            gh release create wails-latest --latest=false \
              --title "wails-mine update anchor" \
              --notes "Update-check anchor for the wails-mine (1.38.x) line. latest.json here is overwritten by every release of that line; versions.json lists the panel's versions."
          fi
          # The anchor always describes the newest published release, pre-release
          # or not: this line runs a single update channel and the client accepts
          # either version shape. The catalog above stays the source for the
          # panel's version list.
          gh release upload wails-latest manifest-input/latest.json --clobber

      - name: Update this line's version catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The catalog lists which versions the update panel may offer. It is
          # rewritten on every release and always keeps the whole history;
          # catalogfilter decides what the panel actually shows.
          anchor=wails-latest
          catalog_keep=100000
          recent=5
          recent_stable=3
          # The channel decides whether the panel counts this entry toward the
          # stable quota, so it is derived from the tag's shape: vX.Y.Z is a
          # stable release, vX.Y.Z-beta.N is a pre-release.
          channel=stable
          case "$RELEASE_TAG" in *-beta.*) channel=beta ;; esac
          mkdir -p catalog
          existing=-
          if gh release download "$anchor" -p versions.json -D catalog --clobber 2>/dev/null; then
            existing=catalog/versions.json
          else
            echo "No catalog yet; starting a new one."
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The next release reads back what this one wrote, so the index keeps
          # every entry and only the filter trims: a small keep here would drop
          # history permanently.
          #
          # Written to a temp file first: the existing index is read from this
          # same path, and a plain redirect would truncate it before the script ran.
          bash scripts/update-versions-index.sh "$existing" "$RELEASE_TAG" "$RELEASE_TAG" "$channel" "$now" "$catalog_keep" \
            | go run ./tools/catalogfilter -recent "$recent" -recent-stable "$recent_stable" \
            > catalog/versions.json.new
          mv catalog/versions.json.new catalog/versions.json
          # Idempotency check: the version just published must be listed exactly
          # once, whatever the filter kept around it.
          jq -e --arg v "$RELEASE_TAG" '.versions | map(select(.version == $v)) | length == 1' catalog/versions.json >/dev/null
          gh release upload "$anchor" catalog/versions.json --clobber
          jq -r '.versions[].version' catalog/versions.json

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Windows release $RELEASE_TAG"
            echo ""
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
