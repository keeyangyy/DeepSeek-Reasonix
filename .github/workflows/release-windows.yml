name: Release Windows

# Fork-only Windows x64 release pipeline.
#
# Upstream publishes four desktop platforms plus CLI/npm behind SignPath,
# Certum, Apple and R2 secrets this fork does not have (release-desktop.yml ->
# release-stable.yml). This fork ships exactly one artifact pair for the
# Electron desktop shell:
#
#   Reasonix-windows-amd64-<version>.zip                    portable archive
#   Reasonix-windows-amd64-installer-<version>.exe          NSIS per-user installer
#
# Tag convention: v<upstream base>-mine.<N>, e.g. v1.39.5-mine.1. The numeric
# part tracks the upstream release this branch was cut from and N is the fork's
# own increment. scripts/desktop-build.sh strips the "-mine.N" suffix before
# stamping the Windows version resource (goversioninfo needs a strictly numeric
# X.X.X) while the full tag rides in the in-app version ldflags.
#
#   git tag v1.39.5-mine.1 && git push origin v1.39.5-mine.1
#
# Normal releases go through release-manual.yml, which waits for CI before it
# creates the tag; this workflow is the tag-driven producer it dispatches.

on:
  push:
    tags:
      # Glob, not regex: GitHub tag filters do not support '+'. Keep this wide
      # and enforce the exact shape in the verify step below.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.39.5-mine.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate tag shape
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-mine\.[0-9]+)?$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-mine.N, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      # Defender keeps freshly written files open and makes the packager trip
      # over its own output; the same exclusions run in ci.yml.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: Install NSIS
        run: pwsh -NoProfile -File ../scripts/install-nsis.ps1

      - name: Build Windows installer and portable archive
        timeout-minutes: 40
        run: ../scripts/desktop-build.sh windows/amd64 "${{ needs.verify.outputs.tag }}" stable

      - name: Verify packaged Windows artifacts
        run: node packaging/verify.mjs ../dist/Reasonix-windows-amd64.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reasonix-windows-amd64
          path: |
            dist/Reasonix-windows-amd64.zip
            dist/Reasonix-windows-amd64-installer.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # download-artifact reads the producer run's artifacts through the
      # Actions API; an explicit permissions block turns every unlisted scope
      # off.
      actions: read
    steps:
      # gh resolves the repository through the checkout's git remote, and
      # `gh release create --generate-notes` runs git itself; without a
      # checkout both fail with "not a git repository".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reasonix-windows-amd64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          zip_asset="Reasonix-windows-amd64-${VERSION}.zip"
          exe_asset="Reasonix-windows-amd64-installer-${VERSION}.exe"
          mv dist/Reasonix-windows-amd64.zip "dist/${zip_asset}"
          mv dist/Reasonix-windows-amd64-installer.exe "dist/${exe_asset}"
          # release-manual.yml creates the release as a draft before this
          # pipeline starts, so a public release is never visible without its
          # assets. Create the draft here too when this workflow is dispatched
          # on its own.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG absent; creating it as a draft."
            gh release create "$RELEASE_TAG" --draft \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            echo "Release $RELEASE_TAG already exists; uploading/overwriting assets."
          fi
          # Drop the unversioned asset names from earlier runs so re-running the
          # same tag never leaves both old and new names behind.
          gh release delete-asset "$RELEASE_TAG" Reasonix-windows-amd64.zip --yes >/dev/null 2>&1 || true
          gh release delete-asset "$RELEASE_TAG" Reasonix-windows-amd64-installer.exe --yes >/dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" "dist/${zip_asset}" "dist/${exe_asset}" --clobber
          # Publish only now that both assets are attached.
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          {
            echo "### Windows release $RELEASE_TAG"
            echo ""
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"