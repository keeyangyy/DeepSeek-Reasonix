name: Release Windows

# Tag-driven Windows release for the v1.38.* line.
#
# Scope: this fork ships Windows x64 only. The upstream pipeline
# (release-stable.yml -> release-desktop.yml) publishes CLI + npm + a four
# platform desktop matrix behind an approval gate and 11 SignPath/Apple/R2
# secrets; none of that applies here, and release-stable-trigger.yml is guarded
# off in this repository so upstream tags cannot dispatch it.
#
# Tag convention: v1.38.NN, where 1.38 is the upstream baseline the fork tracks
# and NN is the fork's own increment. Three numeric segments are required: the
# NSIS installer builds VIProductVersion from `${version}.0` (see
# desktop/build/windows/installer/project.nsi), so a four-segment tag such as
# v1.38.2.1 would produce an invalid five-segment version and fail the build.
#
#   git tag v1.38.21 && git push origin v1.38.21
#
# Produces a GitHub Release with the portable archive and the NSIS installer.

on:
  push:
    tags:
      # Glob, not regex: GitHub tag filters do not support '+'. Keep this wide
      # and enforce the exact three-segment shape in the verify step below.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.38.21)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate tag shape
        id: check
        env:
          RELEASE_TAG: ${{ github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH with numeric segments, got: $RELEASE_TAG" >&2
            echo "::error::four-segment tags (e.g. v1.38.2.1) break the NSIS installer build" >&2
            exit 1
          fi
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

  build:
    needs: verify
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # download-artifact reads the run's artifacts through the Actions API;
      # an explicit permissions block turns every unlisted scope off.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: reasonix-windows-amd64-${{ needs.verify.outputs.version }}
          path: dist

      - name: List artifacts
        run: ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; uploading/overwriting assets."
            gh release upload "$RELEASE_TAG" \
              dist/Reasonix-windows-amd64.zip \
              dist/Reasonix-windows-amd64-installer.exe \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/Reasonix-windows-amd64.zip \
              dist/Reasonix-windows-amd64-installer.exe \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### Windows release $RELEASE_TAG"
            echo ""
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
