name: Release Windows

# Fork-only Windows x64 release pipeline for the Studio (2.x) line.
#
# Upstream publishes through release-studio.yml on a studio-v* tag: four
# platforms, Apple notarization, Certum Authenticode signing, a minisign
# manifest and an R2 mirror — secrets this fork does not have. This file
# produces exactly the two artifacts Windows ships, both from one bundle built
# with signing off (upstream's own unsigned path, prompts and all):
#
#   ReasonixStudio-windows-amd64-<version>.zip               portable archive
#   ReasonixStudio-windows-amd64-installer-<version>.exe     NSIS per-user installer
#
# Tag convention: v<upstream base>-mine.<N>, e.g. v2.26.0-mine.1. The base
# tracks the upstream Studio release this branch was cut from and N is the
# fork's own increment. The whole tag rides into the packaging version and the
# kernel's own version, so an installed fork build states which fork release it
# is rather than the upstream one it derives from.
#
# Normal releases go through release-manual.yml, which waits for CI before it
# creates the tag; this workflow is the tag-driven producer it dispatches.
# Nothing here signs: a fork build is unsigned, so SmartScreen warns on first
# launch and Studio's own update channel (the signed manifest on R2) is absent —
# a fork release is installed by hand.

on:
  push:
    tags:
      # Glob, not regex: GitHub tag filters do not support '+'. Keep this wide
      # and enforce the exact shape — and the branch the tag sits on — in the
      # verify job below.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.26.0-mine.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag shape and the branch it sits on
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mine\.[0-9]+$ ]]; then
            echo "::error::tag must be vMAJOR.MINOR.PATCH-mine.N, got: $RELEASE_TAG" >&2
            exit 1
          fi
          # Only a tag on this fork's own line may publish. The glob above also
          # matches the 1.x line's v1.39.*-mine.* tags, and a tag on some other
          # commit would ship artifacts no CI run here ever gated.
          if ! git merge-base --is-ancestor HEAD origin/studio-mine; then
            echo "::error::$RELEASE_TAG is not on origin/studio-mine" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            desktop/frontend-next/pnpm-lock.yaml
            desktop/electron/pnpm-lock.yaml

      # Defender keeps freshly written files open and makes the packager trip
      # over its own output; the same exclusions run in studio.yml's package job.
      - name: Exclude build dirs from Defender scanning
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP, (go env GOCACHE)) |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "::warning::Defender exclusion failed for ${p}: $($_.Exception.Message)"
            }
          }

      - name: Build the SPA
        working-directory: desktop/frontend-next
        shell: bash
        run: pnpm install --frozen-lockfile && pnpm build

      # The kernel the shell spawns, into the directory electron-builder lists as
      # an extra resource. On Windows this also builds reasonix-computer-helper
      # through MSVC, which the runner has; without the version the kernel
      # refuses to install a remote kernel from a release.
      - name: Build the kernel the shell speaks to
        working-directory: desktop/electron
        shell: bash
        env:
          REASONIX_VERSION: ${{ needs.verify.outputs.version }}
        run: pnpm install --frozen-lockfile && pnpm run build:host

      # The bundle, before anything is packaged around it. The version has to be
      # injected: app.getVersion() reads package.json, which carries 0.0.0 in
      # the tree, and a shell that states 0.0.0 ranks behind every published
      # release and offers itself an update on every launch.
      - name: Build the bundle
        working-directory: desktop/electron
        shell: bash
        # Nothing here signs: the runner has no Certum credentials, and letting
        # electron-builder auto-discover an identity would let a local machine's
        # certificate decide what CI produces.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder --dir \
            -c.extraMetadata.version="${{ needs.verify.outputs.version }}"

      # The portable archive is built from its own copy of the bundle: NSIS writes
      # elevate.exe into the tree it packs, and a zip read beside that would
      # hold it or not by timing. The two targets run one after the other rather
      # than at once: on a cold cache both extract the same 7-Zip archive into
      # $LOCALAPPDATA/electron-builder/Cache at the same moment and one loses the
      # rename to EPERM, which is where windows-latest failed. This is upstream's
      # unsigned path — with Certum signing on, its four signing jobs run
      # between these two steps instead, and this fork has no such secrets.
      - name: Package the installer and the portable archive
        working-directory: desktop/electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          version="${{ needs.verify.outputs.version }}"
          rm -rf ../../zip-src ../../dist-zip
          cp -r ../../dist/win-unpacked ../../zip-src
          pnpm exec electron-builder --prepackaged ../../zip-src --win zip \
            -c.extraMetadata.version="$version" -c.directories.output=../../dist-zip
          pnpm exec electron-builder --prepackaged ../../dist/win-unpacked --win nsis \
            -c.extraMetadata.version="$version"
          mv ../../dist-zip/ReasonixStudio-windows-amd64.zip ../../dist/
          ls -la ../../dist/ReasonixStudio-*

      # The updater verifies what it installs, and Studio's key cannot vouch for
      # the fork's bytes: an unsigned release is one its own builds must refuse.
      # The installer carries the update switch this channel runs it with.
      - name: Sign the Windows artifacts
        working-directory: desktop
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_PRIVATE_KEY:-}" ]; then
            echo "::error::MINISIGN_PRIVATE_KEY is unset, so this release cannot be signed"
            exit 1
          fi
          go run ./cmd/sign sign ../dist/ReasonixStudio-windows-amd64.zip ../dist/ReasonixStudio-windows-amd64-installer.exe
          ls -la ../dist/*.minisig

      - name: Upload the Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reasonix-studio-windows-amd64
          path: |
            dist/ReasonixStudio-windows-amd64.zip
            dist/ReasonixStudio-windows-amd64.zip.minisig
            dist/ReasonixStudio-windows-amd64-installer.exe
            dist/ReasonixStudio-windows-amd64-installer.exe.minisig
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # download-artifact reads the producer run's artifacts through the
      # Actions API; an explicit permissions block turns every unlisted scope
      # off.
      actions: read
    steps:
      # gh resolves the repository through the checkout's git remote, and
      # `gh release create --generate-notes` runs git itself; without a
      # checkout both fail with "not a git repository".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.tag }}

      # The manifest is written here, from the renamed assets, by the same tool
      # the release pipeline uses: it needs Go, not the Windows toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: desktop/go.mod
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reasonix-studio-windows-amd64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          zip_asset="ReasonixStudio-windows-amd64-${VERSION}.zip"
          exe_asset="ReasonixStudio-windows-amd64-installer-${VERSION}.exe"
          # The manifest resolves a platform's artifact by name, and the name it
          # expects carries no version (ReasonixStudio-windows-amd64-installer.exe):
          # a versioned name here leaves the platform lookup empty.
          (cd desktop && go run ./cmd/studio-manifest ../dist "$VERSION" "$RELEASE_TAG")
          # release-manual.yml creates the release as a draft before this
          # pipeline starts, so a public release is never visible without its
          # assets. Create the draft here too when this workflow is dispatched
          # on its own.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG absent; creating it as a draft."
            gh release create "$RELEASE_TAG" --draft \
              --target studio-mine \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            echo "Release $RELEASE_TAG already exists; uploading/overwriting assets."
          fi
          # Drop the versioned asset names an earlier revision of this workflow
          # left behind, so re-running a tag never carries both namings.
          gh release delete-asset "$RELEASE_TAG" "${zip_asset}" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$RELEASE_TAG" "${exe_asset}" --yes >/dev/null 2>&1 || true
          gh release upload "$RELEASE_TAG" \
            dist/ReasonixStudio-windows-amd64.zip dist/ReasonixStudio-windows-amd64.zip.minisig \
            dist/ReasonixStudio-windows-amd64-installer.exe dist/ReasonixStudio-windows-amd64-installer.exe.minisig \
            dist/latest.json --clobber
          # Publish only now that both assets are attached.
          gh release edit "$RELEASE_TAG" --draft=false

      # The fork's own catalog lists its releases to the running build, and it
      # sits under a fixed tag so the address never changes. The list is capped
      # at what the version panel shows; the kernel adds the running build's own
      # row regardless.
      - name: Update the fork's own catalog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          anchor=studio-latest
          mkdir -p catalog
          existing=-
          if gh release download "$anchor" -p versions.json -D catalog --clobber 2>/dev/null; then
            existing=catalog/versions.json
          else
            echo "No catalog yet; starting a new one."
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # The shared script writes Studio's own manifest address; this fork
          # serves its manifests from its own releases instead.
          bash scripts/update-versions-index.sh "$existing" "$VERSION" "$RELEASE_TAG" studio "$now" 3 \
            | sed "s#https://dl.reasonix.io/#https://github.com/${GITHUB_REPOSITORY}/releases/download/#g" \
            > catalog/versions.json
          jq -e --arg v "$VERSION" '.versions | map(select(.version == $v)) | length == 1' catalog/versions.json >/dev/null
          if ! gh release view "$anchor" >/dev/null 2>&1; then
            gh release create "$anchor" --latest=false --target studio-mine \
              --title "Studio catalog (this fork)" \
              --notes "The fork's own Studio catalog. Rewritten on every release; the app reads it at a fixed address."
          fi
          gh release upload "$anchor" catalog/versions.json --clobber
          jq -r '.versions[].version' catalog/versions.json

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          {
            echo "### Windows release $RELEASE_TAG"
            echo ""
            echo "| Asset | Size |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"